name: Deploy to App Engine

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: hamaguchi-family-linebot
          workload_identity_provider: projects/962903877963/locations/global/workloadIdentityPools/github-actions/providers/family-linebot
          service_account: github-appengine-deployer@hamaguchi-family-linebot.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: hamaguchi-family-linebot

      - name: Deploy
        env:
          VERSION_ID: v-${{ github.sha }}
        run: >-
          gcloud app deploy app.yaml
          --project=hamaguchi-family-linebot
          --version="${VERSION_ID:0:14}"
          --promote
          --stop-previous-version
          --quiet
